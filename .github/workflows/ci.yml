name: Portfolio CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build production frontend
        env:
          VITE_BASE_PATH: /portfolio/
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw test

  compose-contract:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f docker-compose.yml config --quiet

  deploy-production:
    name: Notify SgInfra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - frontend
      - backend
      - compose-contract
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production deployment
        env:
          SGINFRA_DISPATCH_TOKEN: ${{ secrets.SGINFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SGINFRA_DISPATCH_TOKEN" ]; then
            echo "::notice::SGINFRA_DISPATCH_TOKEN is not configured; production dispatch skipped"
            exit 0
          fi
          payload="$(jq -nc \
            --arg target portfolio \
            --arg operation deploy-latest \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            '{event_type:"deploy-production",client_payload:{target:$target,operation:$operation,source_repository:$source_repository,source_sha:$source_sha}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $SGINFRA_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Sebas-gatica-dev/sgdev-infra/dispatches \
            --data "$payload"
