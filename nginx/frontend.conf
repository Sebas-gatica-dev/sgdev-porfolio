server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache" always;

    location /portfolio/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
